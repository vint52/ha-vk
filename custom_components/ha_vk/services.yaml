send_message:
  name: Send message
  description: Send a VK message with optional text, image, or video attachment.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when multiple ha-vk entries are configured.
      example: "01JABCDEF0123456789"
      selector:
        text:
    message:
      name: Message
      description: Optional message text to send with the attachment.
      example: "Door opened"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title prepended to the message text.
      example: "Home Assistant"
      selector:
        text:
    image:
      name: Image URL
      description: Optional publicly reachable image URL. Do not use together with video.
      example: "http://frigate.local/api/events/123/snapshot.jpg?bbox=1&crop=0"
      selector:
        text:
    video:
      name: Video URL
      description: Optional publicly reachable video URL. Do not use together with image.
      example: "http://frigate.local/api/events/123/clip.mp4"
      selector:
        text:
    type:
      name: Send type
      description: Used only with video. Select `video` for normal VK videos or `document` to force document upload.
      default: video
      selector:
        select:
          options:
            - video
            - document

send_post:
  name: Send wall post
  description: Publish a post on the configured VK group wall.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when multiple ha-vk entries are configured.
      example: "01JABCDEF0123456789"
      selector:
        text:
    message:
      name: Message
      description: Text of the post.
      required: true
      example: "Пост с картинкой"
      selector:
        text:
          multiline: true
    image:
      name: Image URL
      description: Optional image URL to attach to the post.
      example: "http://frigate.local/api/events/123/snapshot.jpg?bbox=1&crop=0"
      selector:
        text:
