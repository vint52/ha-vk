name: Bug report
description: Report a reproducible problem in ha-vk
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report.
        Please remove tokens, secrets, private URLs, and personal data before submitting.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.4.x"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: ha-vk version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Config flow
        - notify entity
        - ha_vk.send_message
        - ha_vk.send_post
        - Media upload
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share the smallest possible reproduction.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets before posting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
