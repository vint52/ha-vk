[project]
name = "ha-vk"
version = "1.0.1"
description = "Home Assistant custom integration for VK notifications"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
  "tests"
]

[tool.ruff]
target-version = "py312"
line-length = 100
